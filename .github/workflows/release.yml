name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" \
            || (echo "Tag does not match package.json version" && exit 1)
      - name: Verify native engines
        run: pnpm run check-engines | tee engine-report.txt
      - run: pnpm run verify
      - run: pnpm run build
      - name: Create GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file CHANGELOG.md \
            engine-report.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: camerlob-${{ steps.version.outputs.value }}
          path: |
            .next/standalone
            engine-report.txt
          retention-days: 30
