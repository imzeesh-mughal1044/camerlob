# Local self-hosting stack for Camerlob.
#
#   docker compose up --build
#   open http://localhost:3000
#
# The named volume persists the server-side temp workspace across restarts so a
# crash mid-conversion leaves inspectable artefacts for debugging.

services:
  camerlob:
    build:
      context: .
      dockerfile: Dockerfile
    image: camerlob:1.0.0
    container_name: camerlob
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      SERVER_MAX_FILE_SIZE_MB: '50'
      IMAGEMAGICK_PATH: /usr/bin/magick
      LIBRAW_PATH: /usr/bin/dcraw_emu
      GHOSTSCRIPT_PATH: /usr/bin/gs
      EXIFTOOL_PATH: /usr/bin/exiftool
      TEMP_UPLOAD_DIR: /tmp/camerlob
    volumes:
      - camerlob-tmp:/tmp/camerlob
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  camerlob-tmp:
